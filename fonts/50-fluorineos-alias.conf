<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Space Grotesk is the design system UI family but is not packaged in
    Debian 13. Inter is the closest packaged neo-grotesk, so requests for
    Space Grotesk resolve to Inter instead of DejaVu Sans.
  -->
  <alias binding="same">
    <family>Space Grotesk</family>
    <prefer>
      <family>Inter</family>
    </prefer>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <!-- 0.0.1 was never a released family name, but older hints may ask for it. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Space Grotesk</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Inter</string>
    </edit>
  </match>
</fontconfig>
