<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64">

  <!-- Background: void canvas -->
  <rect width="64" height="64" fill="#000000"/>

  <!-- Fluorite diamond outline, simplified for icon size -->
  <g stroke="#1C2229" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="32,8 56,32 32,56 8,32"/>
  </g>

  <!-- Reactive lime accent: top-right edge -->
  <line x1="32" y1="8" x2="56" y2="32"
        stroke="#B4F03A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center dot: reactive lime -->
  <circle cx="32" cy="32" r="2" fill="#B4F03A"/>

</svg>
