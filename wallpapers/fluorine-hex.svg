<svg xmlns="http://www.w3.org/2000/svg"
     width="3840" height="2160"
     viewBox="0 0 3840 2160">

  <title>FluorineOS hex wallpaper</title>

  <!-- Centred hexagonal F emblem on the void canvas.
       The outer ring is the inactive border token, the emblem and inner ring
       use the reactive lime accent. Strokes only: no fills, no glow. -->
  <rect width="3840" height="2160" fill="#000000"/>

  <g transform="translate(1920 1080)">
    <!-- Outer structural ring: pointy-top hexagon, circumradius 780. -->
    <polygon points="0,-780 675.5,-390 675.5,390 0,780 -675.5,390 -675.5,-390"
             fill="none" stroke="#1C2229" stroke-width="6" stroke-linejoin="miter"/>

    <!-- Inner accent ring at 58 percent scale. -->
    <polygon points="0,-452 391.4,-226 391.4,226 0,452 -391.4,226 -391.4,-226"
             fill="none" stroke="#B4F03A" stroke-width="10" stroke-linejoin="miter"/>

    <!-- Geometric F: stem, top arm, middle arm. Hairline shadow offset
         underneath each bar keeps the glyph readable against the ring. -->
    <g stroke="#1C2229" stroke-width="44" stroke-linecap="butt" transform="translate(10 10)">
      <path d="M -150 -300 L -150 300"/>
      <path d="M -150 -300 L 150 -300"/>
      <path d="M -150 -20 L 80 -20"/>
    </g>
    <g stroke="#B4F03A" stroke-width="36" stroke-linecap="butt">
      <path d="M -150 -300 L -150 300"/>
      <path d="M -150 -300 L 150 -300"/>
      <path d="M -150 -20 L 80 -20"/>
    </g>
  </g>
</svg>
