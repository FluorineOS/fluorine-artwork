<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="3840" height="2160"
     viewBox="0 0 3840 2160">

  <!-- Void canvas: pure AMOLED black -->
  <rect width="3840" height="2160" fill="#000000"/>

  <!--
    fluorine-grid.svg
    Ultra-minimal technical corner reticles in #12161B with
    #B4F03A coordinate tick marks labeled 0.0.1
  -->

  <!-- Corner reticles: four corners, each with an L-shaped bracket -->
  <g id="reticles" stroke="#12161B" stroke-width="1" fill="none" stroke-linecap="square">

    <!-- Top-left corner -->
    <polyline points="80,200 80,80 200,80"/>
    <!-- Inner tick marks inside top-left -->
    <line x1="80"  y1="120" x2="100" y2="120"/>
    <line x1="80"  y1="140" x2="92"  y2="140"/>
    <line x1="80"  y1="160" x2="100" y2="160"/>
    <line x1="120" y1="80"  x2="120" y2="100"/>
    <line x1="140" y1="80"  x2="140" y2="92"/>
    <line x1="160" y1="80"  x2="160" y2="100"/>

    <!-- Top-right corner -->
    <polyline points="3760,200 3760,80 3640,80"/>
    <!-- Inner tick marks inside top-right -->
    <line x1="3760" y1="120" x2="3740" y2="120"/>
    <line x1="3760" y1="140" x2="3748" y2="140"/>
    <line x1="3760" y1="160" x2="3740" y2="160"/>
    <line x1="3720" y1="80"  x2="3720" y2="100"/>
    <line x1="3700" y1="80"  x2="3700" y2="92"/>
    <line x1="3680" y1="80"  x2="3680" y2="100"/>

    <!-- Bottom-left corner -->
    <polyline points="80,1960 80,2080 200,2080"/>
    <!-- Inner tick marks inside bottom-left -->
    <line x1="80"  y1="2040" x2="100" y2="2040"/>
    <line x1="80"  y1="2020" x2="92"  y2="2020"/>
    <line x1="80"  y1="2000" x2="100" y2="2000"/>
    <line x1="120" y1="2080" x2="120" y2="2060"/>
    <line x1="140" y1="2080" x2="140" y2="2068"/>
    <line x1="160" y1="2080" x2="160" y2="2060"/>

    <!-- Bottom-right corner -->
    <polyline points="3760,1960 3760,2080 3640,2080"/>
    <!-- Inner tick marks inside bottom-right -->
    <line x1="3760" y1="2040" x2="3740" y2="2040"/>
    <line x1="3760" y1="2020" x2="3748" y2="2020"/>
    <line x1="3760" y1="2000" x2="3740" y2="2000"/>
    <line x1="3720" y1="2080" x2="3720" y2="2060"/>
    <line x1="3700" y1="2080" x2="3700" y2="2068"/>
    <line x1="3680" y1="2080" x2="3680" y2="2060"/>

  </g>

  <!-- Center crosshair in inactive border color -->
  <g id="center-cross" stroke="#12161B" stroke-width="0.5" fill="none">
    <line x1="1900" y1="1080" x2="1940" y2="1080"/>
    <line x1="1920" y1="1060" x2="1920" y2="1100"/>
    <circle cx="1920" cy="1080" r="8" stroke="#12161B" stroke-width="0.5"/>
  </g>

  <!-- Reactive lime #B4F03A: version coordinate ticks in bottom-left reticle area -->
  <g id="version-ticks" fill="none">
    <!-- Three lime accent ticks representing 0.0.1 major/minor/patch -->
    <!-- Major: 0 -->
    <line x1="80" y1="1960" x2="80" y2="1940" stroke="#B4F03A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Minor: 0 -->
    <line x1="80" y1="1930" x2="80" y2="1910" stroke="#B4F03A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Patch: 1 -->
    <line x1="80" y1="1900" x2="80" y2="1870" stroke="#B4F03A" stroke-width="2" stroke-linecap="round"/>

    <!-- Version label: 0.0.1 in top-right corner -->
    <text x="3730" y="112"
          font-family="monospace" font-size="11"
          fill="#B4F03A" text-anchor="end"
          letter-spacing="1">0.0.1</text>

    <!-- Coordinate label top-left -->
    <text x="90" y="112"
          font-family="monospace" font-size="11"
          fill="#B4F03A" text-anchor="start"
          letter-spacing="1">0,0</text>

    <!-- Coordinate label bottom-right -->
    <text x="3730" y="2068"
          font-family="monospace" font-size="11"
          fill="#B4F03A" text-anchor="end"
          letter-spacing="1">3840,2160</text>

    <!-- Coordinate label bottom-left -->
    <text x="90" y="2068"
          font-family="monospace" font-size="11"
          fill="#B4F03A" text-anchor="start"
          letter-spacing="1">0,2160</text>
  </g>

</svg>
